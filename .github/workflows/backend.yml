name: Backend CI

# Runs only when backend code, the local database setup, or this workflow changes.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Ruff, mypy, pytest (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostGIS database for integration tests, same image as docker-compose.yml.
    # The credentials only exist inside this throwaway CI container; they are not secrets.
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: spawn
          POSTGRES_PASSWORD: spawn
          POSTGRES_DB: spawn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spawn -d spawn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      SPAWN_DATABASE_URL: postgresql+psycopg://spawn:spawn@localhost:5432/spawn

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run mypy

      - name: Check the committed OpenAPI schema is up to date
        run: uv run python -m spawn_api.openapi | diff -u openapi.json -

      - name: Apply database migrations to an empty database
        run: uv run alembic upgrade head

      - name: Check ORM models and migrations match
        run: uv run alembic check

      - name: Tests (unit + integration) with coverage
        run: uv run pytest --cov=spawn_api --cov-report=term-missing

  image:
    name: Docker image (built, not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push: false on purpose: the image is checked on every change but never published (ADR 0009).
      # The GitHub Actions cache reuses unchanged layers, so the dependency layer is rebuilt only when uv.lock changes.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: spawn-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image starts and serves HTTP. /health does not need the database, so none is attached.
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 spawn-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Check it does not run as root
        run: test "$(docker run --rm spawn-api:${{ github.sha }} whoami)" = "spawn"

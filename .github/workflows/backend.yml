name: Backend CI

# Runs only when backend code, the local database setup, or this workflow changes.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Ruff, mypy, pytest (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostGIS database for integration tests, same image as docker-compose.yml.
    # The credentials only exist inside this throwaway CI container; they are not secrets.
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: spawn
          POSTGRES_PASSWORD: spawn
          POSTGRES_DB: spawn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spawn -d spawn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      SPAWN_DATABASE_URL: postgresql+psycopg://spawn:spawn@localhost:5432/spawn

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run mypy

      - name: Apply database migrations to an empty database
        run: uv run alembic upgrade head

      - name: Check ORM models and migrations match
        run: uv run alembic check

      - name: Tests (unit + integration) with coverage
        run: uv run pytest --cov=spawn_api --cov-report=term-missing
